# =============================================================================
# QUANTUM DL PLATFORM - GITHUB ACTIONS CI/CD
# =============================================================================
# Full DevOps pipeline for billions of users scale

name: Quantum DL Platform CI/CD

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================
env:
  AWS_REGION: us-east-1
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ECR_REPOSITORY: quantum-dl-platform
  TERRAFORM_VERSION: 1.6.0
  NODE_VERSION: '20'

# =============================================================================
# PERMISSIONS
# =============================================================================
permissions:
  contents: read
  id-token: write
  actions: write
  checks: write
  deployments: write
  issues: write
  discussions: write
  packages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

# =============================================================================
# JOBS
# =============================================================================

jobs:
  # ==========================================================================
  # CODE QUALITY
  # ==========================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          pip install uv
          uv sync
          
      - name: Run Ruff linter
        run: uv run ruff check src/
        
      - name: Run Ruff formatter
        run: uv run ruff format --check src/
        
      - name: Run type checking
        run: uv run ruff check --select=F821 src/

  # ==========================================================================
  # UNIT TESTS
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          pip install uv
          uv sync
          
      - name: Run pytest
        run: uv run pytest tests/ -v --cov=src --cov-report=xml
        
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: unit-tests
          
      - name: Run benchmark tests
        run: uv run pytest tests/ -v -k "benchmark" --benchmark-only
        continue-on-error: true

  # ==========================================================================
  # INTEGRATION TESTS
  # ==========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          pip install uv
          uv sync
          
      - name: Start Redis
        uses: supercharge/redis-github-action@7.0.0
        with:
          redis-version: 7
          
      - name: Start PostgreSQL
        uses: supercharge/postgresql-github-action@7.2.0
        with:
          postgresql-version: '15'
          
      - name: Run integration tests
        run: uv run pytest tests/ -v -k "integration"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379
          TEST_ENV: true

  # ==========================================================================
  # SECURITY SCANS
  # ==========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          pip install uv
          uv sync
          
      - name: Run Bandit security scan
        run: uv run bandit -r src/
        
      - name: Run safety scan
        run: uv run safety check
        continue-on-error: true
        
      - name: Run secret scanning
        uses: trufflesecurity/trufflehog@v3
        with:
          path: .
          extra_args: --json --no-update

  # ==========================================================================
  # BUILD & PUSH DOCKER IMAGES
  # ==========================================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    outputs:
      api-image: ${{ steps.meta.outputs.tags }}
      worker-image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Login to Amazon ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AWS_REGION }}.ecr.amazonaws.com
          username: ${{ secrets.AWS_ACCESS_KEY_ID }}
          password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME }}
            ${{ env.AWS_REGION }}.ecr.amazonaws.com/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.ref_name }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.description=Quantum DL Platform - Billions of users scale
            org.opencontainers.image.vendor=Quantum AI
            org.opencontainers.image.licenses=MIT
            
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          build-args: |
            SERVICE_NAME=api
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ github.sha }}
          target: api
          
      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
          build-args: |
            SERVICE_NAME=worker
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ github.sha }}
          target: worker
          
      - name: Build and push model-server image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=model-server
          cache-to: type=gha,mode=max,scope=model-server
          build-args: |
            SERVICE_NAME=model-server
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ github.sha }}
          target: model-server

  # ==========================================================================
  # DEPLOY TO STAGING
  # ==========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref_name == 'develop'
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Deploy to EKS
        uses: aws-actionsekskube-deploy@v1
        with:
          cluster-name: quantum-dl-staging
          namespace: staging
          manifest: k8s/
          delete: false
          
      - name: Verify staging deployment
        run: |
          kubectl rollout status deployment/quantum-dl-api -n staging
          kubectl rollout status deployment/quantum-dl-worker -n staging
          
      - name: Run smoke tests
        run: |
          curl -f https://staging.api.quantum-dl.ai/health || exit 1
          
      - name: Run load test
        run: |
          pip install locust
          locust -f tests/load/locustfile.py --headless -u 1000 -r 100 -t 60s --host https://staging.api.quantum-dl.ai
        continue-on-error: true

  # ==========================================================================
  # DEPLOY TO PRODUCTION
  # ==========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.ref_name == 'main' && github.event_name == 'push'
    environment:
      name: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Deploy to EKS
        uses: aws-actionsekskube-deploy@v1
        with:
          cluster-name: quantum-dl-production
          namespace: production
          manifest: k8s/
          delete: false
          
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/quantum-dl-api -n production
          kubectl rollout status deployment/quantum-dl-worker -n production
          kubectl rollout status deployment/quantum-dl-model-server -n production
          
      - name: Run canary deployment
        run: |
          kubectl patch service quantum-dl-api-lb -n production -p '{"spec":{"type":"LoadBalancer"}}'
          sleep 30
          # Verify traffic
          for i in {1..10}; do
            curl -f https://api.quantum-dl.ai/health && break
            sleep 5
          done
          
      - name: Run production smoke tests
        run: |
          curl -f https://api.quantum-dl.ai/health || exit 1
          curl -f https://api.quantum-dl.ai/ready || exit 1
          
      - name: Post deployment notification
        uses: slackapi/slack-github-action@v1.25
        with:
          channel-id: 'C0123456789'
          payload: |
            {
              "text": "Production deployment completed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Quantum DL Platform* deployed to production"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Commit: ${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "Actor: ${{ github.actor }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  # ==========================================================================
  # TERRAFORM PLAN
  # ==========================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    if: github.event_name == 'pull_request'
    outputs:
      tf_plan_has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: true
          
      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: terraform
        continue-on-error: true
        
      - name: Initialize Terraform
        run: terraform init -input=false
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          
      - name: Plan Terraform
        id: plan
        run: |
          terraform plan -input=false -out=tfplan
          has_changes=$(terraform show -json tfplan | jq '.resource_changes | length > 0')
          echo "has_changes=$has_changes" >> $GITHUB_OUTPUT
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          
      - name: Post plan as comment
        uses: actions/github-script@v7
        with:
          script: |
            const terraformOutput = await fs.promises.readFile('terraform/tfplan', 'utf8');
            const planSummary = terraformOutput.match(/Plan: .*/g)?.[0] || 'View Terraform plan';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan\n\n${planSummary}\n\n*Full plan: [tfplan](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*`
            });

  # ==========================================================================
  # TERRAFORM APPLY
  # ==========================================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [terraform-plan, deploy-production]
    if: github.ref_name == 'main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          
      - name: Apply Terraform
        run: terraform apply -auto-approve -input=false
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # ==========================================================================
  # PERFORMANCE TESTS
  # ==========================================================================
  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run k6 load test
        uses: grafana/k6-action@v0.2.0
        with:
          filename: tests/load/k6.js
          flags: --vus 1000 --duration 60s
          
      - name: Run benchmark
        run: |
          pip install uv
          uv sync
          uv run pytest tests/ -v -k "benchmark" --benchmark-json=benchmark.json
          
      - name: Store benchmark result
        uses: benchmark-action/github-action@1
        with:
          tool: pytest-benchmark
          filename: benchmark.json
          export-alert: false